<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KLBS Day Closing Popup — Local Preview</title>
    <link rel="stylesheet" href="../src/renderer/styles/variables.css">
    <link rel="stylesheet" href="../src/renderer/styles/settings.css">
    <style>
        body{margin:0;min-height:100vh;background:#f5f6f8;color:var(--text);font-family:Arial,sans-serif}
        .preview-page{max-width:1000px;margin:36px auto;padding:24px;opacity:.72}
        .preview-banner{position:fixed;right:12px;top:12px;z-index:1000001;padding:8px 12px;border-radius:8px;background:#fff4d6;color:#765000;font-size:12px;font-weight:800}
        .preview-controls{position:fixed;left:12px;bottom:12px;z-index:1000001;padding:8px 12px;border-radius:8px;background:#fff;color:#333;font-size:12px;box-shadow:0 4px 20px #0002}
        .preview-controls kbd{padding:2px 5px;border:1px solid #ccc;border-radius:4px;background:#fafafa}
        .preview-card{padding:28px;background:#fff;border:1px solid #ddd;border-radius:12px}
        .preview-card h1{margin-top:0}
        .preview-row{display:flex;justify-content:space-between;padding:14px;border-bottom:1px solid #eee}
    </style>
</head>
<body>
    <div class="preview-banner">LOCAL MOCK PREVIEW · NO BUSINESS ACTIONS</div>
    <main class="preview-page" aria-hidden="true">
        <h1>System · Day Closing</h1>
        <div class="preview-card">
            <h2>DAY CLOSING SUMMARY</h2>
            <div class="preview-row"><span>Business Date</span><b>27/09/2026</b></div>
            <div class="preview-row"><span>Total Bills</span><b>12</b></div>
            <div class="preview-row"><span>Net Billing</span><b>₹84,900</b></div>
            <p>The Day Closing page remains visible behind the lifecycle popup.</p>
        </div>
    </main>
    <div class="preview-controls">Keys: <kbd>R</kbd> reset · <kbd>→</kbd> advance · <kbd>S</kbd> success · <kbd>F</kbd> failure</div>
    <div id="dayClosingLifecycleOverlay" class="dc-lifecycle-overlay is-visible" role="presentation" aria-live="polite">
        <section class="dc-lifecycle-shell" role="dialog" aria-modal="true" aria-labelledby="dcLifecycleTitle">
            <div class="dc-lifecycle-brand">KAIRA LUXE</div>
            <div class="dc-lifecycle-kicker">DAY CLOSING</div>
            <h1 id="dcLifecycleTitle"></h1>
            <p id="dcLifecycleSubtitle"></p>
            <div id="dcLifecycleStages" class="dc-lifecycle-stages"></div>
            <div id="dcLifecycleNotice" class="dc-lifecycle-notice" hidden></div>
            <div class="dc-lifecycle-actions">
                <button id="previewReturn" class="klbs-cancel-btn" hidden>RESET PREVIEW</button>
                <button id="previewClose" class="klbs-primary-btn" disabled>CLOSE KLBS</button>
            </div>
        </section>
    </div>
    <script src="../src/renderer/modules/system/dayClosingLifecycleState.js"></script>
    <script>
        const lifecycle = window.createDayClosingLifecycleState();
        let state = null;
        let stageIndex = 0;
        const order = lifecycle.order;
        const labels = {
            FINALIZING_ACCOUNTS:"Finalizing accounts", BUSINESS_DAY_CLOSED:"Business Day CLOSED",
            CREATING_BACKUP:"Creating backup", VERIFYING_BACKUP:"Verifying backup",
            UPDATING_DSR:"Updating DSR", SENDING_EMAIL:"Sending email",
            COMPLETING_DAY_CLOSING:"Completing Day Closing"
        };
        document.getElementById("dcLifecycleStages").innerHTML = order.map((stage,index) =>
            `<div class="dc-lifecycle-stage" data-stage="${stage}"><span class="dc-lifecycle-stage-icon" aria-hidden="true">${index+1}</span><span class="dc-lifecycle-stage-label"></span><span class="dc-lifecycle-stage-state"></span></div>`
        ).join("");
        function render() {
            document.getElementById("dcLifecycleTitle").textContent=state.title;
            document.getElementById("dcLifecycleTitle").className=state.outcome==="success"?"is-success":state.outcome==="failure"?"is-error":"";
            document.getElementById("dcLifecycleSubtitle").textContent=state.subtitle;
            const notice=document.getElementById("dcLifecycleNotice");
            notice.hidden=!state.notice; notice.className=`dc-lifecycle-notice${state.noticeType?` is-${state.noticeType}`:""}`; notice.textContent=state.notice;
            document.getElementById("previewClose").disabled=!state.closeEnabled;
            document.getElementById("previewReturn").hidden=!state.returnVisible;
            state.stages.forEach((item,index)=>{
                const row=document.querySelector(`[data-stage="${item.stage}"]`);
                row.className=`dc-lifecycle-stage is-${item.status}`;
                row.querySelector(".dc-lifecycle-stage-icon").textContent=item.status==="complete"?"✓":item.status==="active"?"●":item.status==="warning"?"!":String(index+1);
                row.querySelector(".dc-lifecycle-stage-label").textContent=item.label;
                row.querySelector(".dc-lifecycle-stage-state").textContent=item.detail;
            });
        }
        function reset(){state=lifecycle.begin();stageIndex=0;render();}
        reset();
        document.addEventListener("keydown",event=>{
            const key=event.key.toLowerCase();
            if(key==="r"){reset();return;}
            if(key==="arrowright"&&state.outcome==="running"&&stageIndex<order.length-1){stageIndex+=1;state=lifecycle.progress(state.attemptId,order[stageIndex]);render();}
            if(key==="s"&&state.outcome==="running"){
                state=lifecycle.finish(state.attemptId,{success:true,backupStatus:"SUCCESS",consolidatedReportingJob:{jobId:1},onlineDelivery:{online:true,dsrStatus:"PENDING",emailStatus:"DELIVERED"}});render();
            }
            if(key==="f"&&state.outcome==="running"){state=lifecycle.fail(state.attemptId,"Mock mandatory backup verification failure",true);render();}
        });
        document.getElementById("previewClose").addEventListener("click",()=>{
            state.notice="Preview only. Electron safe-close was not invoked.";state.noticeType="warning";render();
        });
        document.getElementById("previewReturn").addEventListener("click",reset);
    </script>
</body>
</html>

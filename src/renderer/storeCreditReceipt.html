<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Store Credit Receipt</title>

    <link
        rel="stylesheet"
        href="storeCreditReceipt.css"
    >

</head>

<body>

    <div class="receipt-container">

        <!-- =========================
             STORE HEADER
        ========================== -->

        <div class="store-header">

            <div
                id="storeName"
                class="store-name"
            >
                KAIRA LUXE
            </div>

            <div
                id="storeAddress"
                class="store-address"
            >
            </div>

            <div
                id="storePhone"
                class="store-phone"
            >
            </div>

        </div>


        <div class="separator"></div>


        <!-- =========================
             RECEIPT TITLE
        ========================== -->

        <div class="receipt-title">

            STORE CREDIT

        </div>


        <div class="separator"></div>


        <!-- =========================
             STORE CREDIT DETAILS
        ========================== -->

        <div class="details-section">

            <div class="detail-row">

                <span>Store Credit No.</span>

                <strong
                    id="storeCreditNo"
                >
                    -
                </strong>

            </div>


            <div class="detail-row">

                <span>Return No.</span>

                <span
                    id="returnNo"
                >
                    -
                </span>

            </div>


            <div class="detail-row">

                <span>Original Bill No.</span>

                <span
                    id="originalBillNo"
                >
                    -
                </span>

            </div>


            <div class="detail-row">

                <span>Issued On</span>

                <span
                    id="issueDate"
                >
                    -
                </span>

            </div>


            <div class="detail-row valid-until-row">

                <span>Valid Until</span>

                <strong
                    id="validUntil"
                >
                    -
                </strong>

            </div>

        </div>


        <div class="separator"></div>


        <!-- =========================
             CUSTOMER DETAILS
        ========================== -->

        <div class="section-heading">

            CUSTOMER DETAILS

        </div>


        <div class="details-section">

            <div class="detail-row">

                <span>Name</span>

                <span
                    id="customerName"
                >
                    -
                </span>

            </div>


            <div class="detail-row">

                <span>Mobile</span>

                <span
                    id="customerMobile"
                >
                    -
                </span>

            </div>

        </div>


        <div class="separator"></div>


        <!-- =========================
             CREDIT VALUE
        ========================== -->

        <div class="credit-value-section">

            <div class="credit-label">

                STORE CREDIT VALUE

            </div>


            <div
                id="storeCreditAmount"
                class="credit-amount"
            >
                ₹0.00
            </div>

        </div>


        <div class="separator"></div>


        <!-- =========================
             TERMS & CONDITIONS
        ========================== -->

        <div class="section-heading">

            TERMS & CONDITIONS

        </div>


        <div
            id="termsConditions"
            class="terms-conditions"
        >

            <!--
                Terms will be inserted
                by JavaScript.
            -->

        </div>


        <div class="separator"></div>


        <!-- =========================
             FOOTER
        ========================== -->

        <div class="receipt-footer">

            <div>

                This is a system generated receipt.

            </div>

            <div class="thank-you">

                Thank You!

            </div>

        </div>

    </div>


    <script
        src="storeCreditReceipt.js"
    ></script>

</body>

</html>
